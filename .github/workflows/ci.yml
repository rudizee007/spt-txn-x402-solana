name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: gofmt · vet · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      # gofmt -l lists offending files but exits 0, so it must be asserted
      # explicitly. Two files here had drifted unnoticed precisely because
      # nothing was checking.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1

  security:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)"/bin/govulncheck ./...

