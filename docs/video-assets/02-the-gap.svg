<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 z" fill="#7D848E"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#1E1F21"/>

  <text x="960" y="170" text-anchor="middle"
        font-family="'Space Mono','IBM Plex Mono',monospace" font-size="58"
        fill="#EEEFF1">x402 answers one question.</text>

  <!-- agent -->
  <rect x="150" y="330" width="360" height="150" rx="10" fill="#26282B" stroke="#3A3D42" stroke-width="3"/>
  <text x="330" y="398" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace"
        font-size="40" fill="#EEEFF1">AI AGENT</text>
  <text x="330" y="444" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace"
        font-size="26" fill="#7D848E">acts on its own</text>

  <!-- arrow -->
  <line x1="530" y1="405" x2="1390" y2="405" stroke="#7D848E" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="960" y="368" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace"
        font-size="30" fill="#7D848E">x402 &#183; HTTP 402 &#8594; payment</text>

  <!-- merchant -->
  <rect x="1410" y="330" width="360" height="150" rx="10" fill="#26282B" stroke="#3A3D42" stroke-width="3"/>
  <text x="1590" y="398" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace"
        font-size="40" fill="#EEEFF1">MERCHANT</text>
  <text x="1590" y="444" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace"
        font-size="26" fill="#7D848E">USDC settles</text>

  <!-- answered -->
  <rect x="150" y="600" width="800" height="150" rx="10" fill="#14251A" stroke="#3FB950" stroke-width="3"/>
  <text x="200" y="668" font-family="'Space Mono','IBM Plex Mono',monospace"
        font-size="52" fill="#3FB950">&#10003;</text>
  <text x="270" y="666" font-family="'Space Mono','IBM Plex Mono',monospace"
        font-size="36" fill="#EEEFF1">Did the money move?</text>
  <text x="270" y="714" font-family="'Space Mono','IBM Plex Mono',monospace"
        font-size="28" fill="#3FB950">answered</text>

  <!-- unanswered -->
  <rect x="970" y="600" width="800" height="150" rx="10" fill="#2A1618" stroke="#E5484D" stroke-width="3"/>
  <text x="1020" y="668" font-family="'Space Mono','IBM Plex Mono',monospace"
        font-size="52" fill="#E5484D">&#10007;</text>
  <text x="1090" y="666" font-family="'Space Mono','IBM Plex Mono',monospace"
        font-size="36" fill="#EEEFF1">Was the agent allowed to?</text>
  <text x="1090" y="714" font-family="'Space Mono','IBM Plex Mono',monospace"
        font-size="28" fill="#E5484D">never checked</text>

  <text x="960" y="900" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace"
        font-size="42" fill="#EEEFF1">A hijacked agent pays an attacker &#8212; faithfully.</text>

  <text x="960" y="972" text-anchor="middle" font-family="'Space Mono','IBM Plex Mono',monospace"
        font-size="28" fill="#7D848E">Authorization, delegation and revocation are out of x402's scope, by design.</text>
</svg>
